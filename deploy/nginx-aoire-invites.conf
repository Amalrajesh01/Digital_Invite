# Served on the server's IP at :8004 (same pattern as the other apps). Attach a domain later by adding a
# second server block with `server_name your.domain;` and running certbot.
server {
    listen 8004;
    server_name 65.108.245.110;
    client_max_body_size 110M;   # guest video/voice wishes

    location / {
        proxy_pass http://127.0.0.1:8104;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
