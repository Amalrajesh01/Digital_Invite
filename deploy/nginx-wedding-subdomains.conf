# {slug}.invites.stackbridgelab.com -> the same app as invites.stackbridgelab.com (127.0.0.1:8104).
# Installed by deploy/wildcard-subdomains.sh as /etc/nginx/sites-available/invites-wildcard.stackbridgelab.com, and only
# after the wildcard certificate exists. It does not touch any other virtual host: nginx always prefers an exact
# server_name (invites.stackbridgelab.com, attendedge.netjetgo.com, ...) over this wildcard, and this block is not a default_server.
#
# What the app does with the names (src/proxy.ts): an assigned slug shows that wedding; anything else under this domain is 404/400,
# and /admin, /login, /client, /editor, exports, uploads and the marketing site answer 404 on these addresses.

server {
    listen 80;
    server_name *.invites.stackbridgelab.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.invites.stackbridgelab.com;

    ssl_certificate     /etc/letsencrypt/live/invites-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invites-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 110M;   # guest video/voice wishes, same as the main site

    location / {
        proxy_pass http://127.0.0.1:8104;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;      # overwritten here, so a client-sent value never reaches the app
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;     # not $proxy_add_x_forwarded_for: the app uses this for per-IP rate limits
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
